name: Testing & Publish
on:
  push:
  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The library itself runs on Node 18+, but the dev tools (ava 8, cspell 10, nyc 18) need Node 22+.
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Building & Testing
        run: yarn test

  publish:
    runs-on: ubuntu-latest
    needs: testing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # npm の Trusted Publishing（OIDC）で公開待ちに積む（staged publish）。トークンの secret は使わない。
    # npmjs.com のパッケージ設定で、このリポジトリの publish.yml を Trusted Publisher に登録してある前提
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # registry-url は付けない。付けると setup-node が NODE_AUTH_TOKEN を参照する npm の設定を書き、
      # yarn v1 がその未設定の変数で落ちる。OIDC では要らない
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: yarn
      - name: Skip if this version is already on npm
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install modules
        if: steps.check.outputs.skip != 'true'
        run: yarn install --frozen-lockfile
      # Trusted Publishing には npm 11.5.1 以上が要る
      - name: Update npm
        if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@latest
      # Trusted Publisher の権限は「stage publish」。ここでは公開待ちに積むだけで、
      # npmjs.com で 2FA つきの承認をすると公開される（npm stage approve <id> でも可）
      - name: Stage the release on npm
        if: steps.check.outputs.skip != 'true'
        run: npm stage publish . --access public
